<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2XMZNLZYX6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());
        gtag('config', 'G-2XMZNLZYX6');
    </script>
    <!-- Histats -->
    <script>
        var _Hasync = _Hasync || [];
        _Hasync.push([
            'Histats.start',
            '1,5058948,4,0,0,0,00010000'
        ]);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);
        (function () {
            var hs = document.createElement('script');
            hs.async = true;
            hs.type = 'text/javascript';
            hs.src = 'https://s10.histats.com/js15_as.js';
            document.head.appendChild(hs);
        })();
    </script>
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #player {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        #title {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Video Player -->
    <video
        id="player"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload"
    >
        <source src="" type="video/mp4">
        Browser kamu tidak mendukung pemutar video.
    </video>
    <!-- Histats fallback -->
    <noscript>
        <a href="/" target="_blank" rel="noopener">
            <img
                src="https://sstatic1.histats.com/0.gif?5058948&101"
                alt=""
                border="0"
            >
        </a>
    </noscript>
    <script>
        /* =========================
           KONFIGURASI
        ========================= */
        const JSON_URL = "/videos.json";
        // Smart link untuk redirect otomatis
        const DIRECT_LINK =
            "https://auctionr.org/4/91e60a9698632a87fc7082108970afbd";
        // Daftar iklan Shopee
        const SHOPEE_LINKS = [
            "https://s.shopee.co.id/7AeWbiyANg",
            "https://s.shopee.co.id/4B0v6LaeiY",
            "https://s.shopee.co.id/9fLreWxby0"
        ];
        const video = document.getElementById("player");
        let firstClickHandled = false;
        let redirected = false;
        let adIndex = 0;
        /* =========================
           PILIH SMART LINK RANDOM
        ========================= */
        function getRandomAd() {
            const ads = [
                DIRECT_LINK,
                ...SHOPEE_LINKS
            ];
            const randomIndex =
                Math.floor(Math.random() * ads.length);
            return ads[randomIndex];
        }
        /* =========================
           REDIRECT OTOMATIS
        ========================= */
        function redirectRandom() {
            if (redirected) return;
            redirected = true;
            window.location.href = getRandomAd();
        }
        /* =========================
           AMBIL ID VIDEO DARI URL
           Contoh: domain.com/#/J1Mu.mp4
        ========================= */
        let id = "";
        try {
            id = decodeURIComponent(
                window.location.hash.replace(/^#\/?/, "")
            );
        } catch (error) {
            console.error("ID video tidak valid:", error);
        }
        /* =========================
           LOAD VIDEOS.JSON
        ========================= */
        async function loadVideo() {
            try {
                const response = await fetch(JSON_URL);
                if (!response.ok) {
                    throw new Error("Gagal mengambil videos.json");
                }
                const data = await response.json();
                const videos = Array.isArray(data.videos)
                    ? data.videos
                    : [];
                const selected = videos.find(
                    item => item.id === id
                );
                if (!selected || !selected.cdn) {
                    document.body.innerHTML = `
                        <h2 style="
                            color: white;
                            text-align: center;
                            margin: 40px 20px;
                        ">
                            Video tidak ditemukan
                        </h2>
                    `;
                    return;
                }
                video.src = selected.cdn;
                video.load();
            } catch (error) {
                console.error(error);
                document.body.innerHTML = `
                    <h2 style="
                        color: white;
                        text-align: center;
                        margin: 40px 20px;
                    ">
                        Gagal memuat video
                    </h2>
                `;
            }
        }
        loadVideo();
        /* =========================
           KLIK VIDEO
           Klik pertama: tidak membuka iklan.
           Klik berikutnya: buka Shopee berurutan.
        ========================= */
        video.addEventListener("click", function () {
            if (redirected) return;
            if (!firstClickHandled) {
                firstClickHandled = true;
                return;
            }
            if (adIndex < SHOPEE_LINKS.length) {
                const link = SHOPEE_LINKS[adIndex];
                adIndex++;
                // Dibuka pada tab baru sesuai tindakan pengguna
                window.open(link, "_blank", "noopener");
            }
        });
        /* =========================
           REDIRECT SETELAH 15 DETIK
        ========================= */
        video.addEventListener("timeupdate", function () {
            if (
                !redirected &&
                video.currentTime >= 15
            ) {
                redirectRandom();
            }
        });
    </script>
</body>
</html>
