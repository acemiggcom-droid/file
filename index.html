
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2XMZNLZYX6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag('js', new Date());
    gtag('config', 'G-2XMZNLZYX6');
    gtag('config', 'G-2EMZHLZYX6');
  </script>

  <!-- Histats -->
  <script>
    var _Hasync = _Hasync || [];
    _Hasync.push(['Histats.start', '1,5058948,4,0,0,0,00010000']);
    _Hasync.push(['Histats.fasi', '1']);
    _Hasync.push(['Histats.track_hits', '']);

    (function () {
      var hs = document.createElement('script');
      hs.async = true;
      hs.src = 'https://s10.histats.com/js15_as.js';
      (document.head || document.body).appendChild(hs);
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 10px;
    }

    .player {
      width: 100%;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      max-height: 85vh;
      background: #000;
    }

    #message {
      padding: 16px 8px;
      text-align: center;
      color: #ddd;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="player">
      <video
        id="video"
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
      ></video>
    </div>
    <div id="message">Memuat video...</div>
  </div>

  <script>
    const video = document.getElementById('video');
    const message = document.getElementById('message');

    // Link iklan
    const SHOPEE_1 = 'https://s.shopee.co.id/7AeWbiyANg';
    const SHOPEE_2 = 'https://s.shopee.co.id/4B0v6LaeiY';
    const SHOPEE_3 = 'https://s.shopee.co.id/9fLreWxby0';

    const DIRECT_LINK =
      'https://auctionr.org/4/91e60a9698632a87fc7082108970afbd';

    // Jadwal iklan saat video berjalan
    const ADS = [
      { time: 5,  url: DIRECT_LINK },
      { time: 15, url: SHOPEE_1 },
      { time: 30, url: SHOPEE_2 },
      { time: 50, url: SHOPEE_3 }
    ];

    
let firstClickHandled = false;

video.addEventListener('click', function () {
  if (firstClickHandled) return;

  firstClickHandled = true;

  window.open(
    'https://auctionr.org/4/91e60a9698632a87fc7082108970afbd',
    '_blank'
  );
}, true);
    let waitingForAd = false;
    let currentAdWindow = null;

    const shownAds = new Set();

    // Ambil ID video dari URL, contoh: domain.com/#/K1Jr.mp4
    function getVideoId() {
      try {
        return decodeURIComponent(
          window.location.hash.replace(/^#\/?/, '')
        );
      } catch (error) {
        return window.location.hash.replace(/^#\/?/, '');
      }
    }

    // Tunggu iklan ditutup, lalu lanjutkan video
    function waitForAdToClose(adWindow, shouldResume) {
      if (!adWindow) {
        waitingForAd = false;
        currentAdWindow = null;

        if (shouldResume) {
          video.play().catch(() => {
            message.textContent =
              'Tekan tombol Play untuk melanjutkan video.';
          });
        }
        return;
      }

      currentAdWindow = adWindow;
      waitingForAd = true;
      video.pause();

      const checkClosed = setInterval(function () {
        try {
          if (adWindow.closed) {
            clearInterval(checkClosed);
            waitingForAd = false;
            currentAdWindow = null;

            if (shouldResume) {
              video.play().catch(() => {
                message.textContent =
                  'Tekan tombol Play untuk melanjutkan video.';
              });
            }
          }
        } catch (error) {
          clearInterval(checkClosed);
          waitingForAd = false;
          currentAdWindow = null;
        }
      }, 500);
    }

    // Iklan pertama: dibuka ketika pengguna mengeklik video
    video.addEventListener('click', function () {
      if (firstClickHandled) return;

      firstClickHandled = true;
      video.pause();

      const adWindow = window.open(SHOPEE_1, '_blank');

      if (adWindow) {
        message.textContent =
          'Tutup tab iklan untuk mulai menonton video.';
        waitForAdToClose(adWindow, true);
      } else {
        message.textContent =
          'Iklan diblokir browser. Tekan Play untuk menonton.';
      }
    }, true);

    // Iklan otomatis pada detik 5, 15, 30, dan 50
    video.addEventListener('timeupdate', function () {
      if (waitingForAd) return;

      for (let i = 0; i < ADS.length; i++) {
        const ad = ADS[i];

        if (
          video.currentTime >= ad.time &&
          !shownAds.has(i)
        ) {
          shownAds.add(i);

          const adWindow = window.open(ad.url, '_blank');

          // Jika berhasil terbuka, jeda video sampai iklan ditutup.
          if (adWindow) {
            waitForAdToClose(adWindow, true);
          }

          // Jika diblokir, video tetap berjalan.
          break;
        }
      }
    });

    // Muat video berdasarkan videos.json
    async function loadVideo() {
      const id = getVideoId();

      if (!id) {
        message.textContent =
          'Video tidak ditemukan. Buka tautan video yang benar.';
        return;
      }

      try {
        const response = await fetch('./videos.json', {
          cache: 'no-cache'
        });

        if (!response.ok) {
          throw new Error('Gagal memuat videos.json');
        }

        const data = await response.json();
        const videos = Array.isArray(data)
          ? data
          : data.videos;

        if (!Array.isArray(videos)) {
          throw new Error('Format videos.json tidak valid');
        }

        const selectedVideo = videos.find(function (item) {
          return item.id === id;
        });

        if (!selectedVideo || !selectedVideo.cdn) {
          message.textContent = 'Video tidak ditemukan.';
          return;
        }

        video.src = selectedVideo.cdn;
        video.load();

        message.textContent =
          'Video siap. Klik video untuk membuka iklan pertama.';
      } catch (error) {
        console.error(error);
        message.textContent =
          'Video gagal dimuat. Periksa videos.json dan koneksi internet.';
      }
    }

    video.addEventListener('error', function () {
      message.textContent =
        'Video gagal diputar atau CDN tidak tersedia.';
    });

    video.addEventListener('playing', function () {
      if (!waitingForAd) {
        message.textContent = '';
      }
    });

    // Tangani tombol Play jika iklan pertama diblokir browser
    video.addEventListener('play', function () {
      if (waitingForAd) {
        video.pause();
      }
    });

    loadVideo();
  </script>
</body>
</html>
