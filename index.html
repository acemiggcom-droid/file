    <!-- CSS -->
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #player {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #status {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #fff;
            background: #000;
            font: 16px Arial, sans-serif;
            text-align: center;
        }

        #status[hidden] {
            display: none;
        }

        #adBox {
            display: none;
            position: fixed;
            z-index: 10;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 350px;
            padding: 16px;
            color: #fff;
            background: #222;
            border: 1px solid #555;
            border-radius: 12px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        #adMessage {
            margin: 0 0 14px;
            line-height: 1.5;
        }

        .ad-button {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #adButton {
            background: #ff6b00;
        }

        #closeAd {
            margin-left: 6px;
            background: #444;
        }
    </style>
</head>

<body>

    <!-- VIDEO PLAYER -->
    <video
        id="player"
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
        controlsList="nodownload"
    >
        Browser kamu tidak mendukung pemutar video.
    </video>

    <!-- STATUS VIDEO -->
    <div id="status" role="status" aria-live="polite">
        Memuat video...
    </div>

    <!-- KOTAK IKLAN -->
    <div id="adBox" role="dialog" aria-live="polite" aria-label="Iklan">
        <p id="adMessage">
            Ketuk tombol untuk membuka iklan.
        </p>

        <button id="adButton" class="ad-button" type="button">
            Buka Iklan
        </button>

        <button id="closeAd" class="ad-button" type="button">
            Tutup
        </button>
    </div>

    <!-- HISTATS FALLBACK -->
    <noscript>
        <a href="/" target="_blank" rel="noopener noreferrer">
            <img
                src="https://sstatic1.histats.com/0.gif?5058948&101"
                alt=""
                border="0"
            >
        </a>
    </noscript>

    <!-- JAVASCRIPT -->
    <script>
        'use strict';

        /* =========================
           KONFIGURASI
        ========================= */

        const JSON_URL = '/videos.json';

        const DIRECT_LINK =
            'https://auctionr.org/4/91e60a9698632a87fc7082108970afbd';

        const SHOPEE_LINKS = [
            'https://s.shopee.co.id/7AeWbiyANg',
            'https://s.shopee.co.id/4B0v6LaeiY',
            'https://s.shopee.co.id/9fLreWxby0'
        ];

        // Waktu kemunculan iklan dalam detik.
        const AD_TIMES = [5, 30, 50];

        // Urutan link iklan sesuai AD_TIMES.
        const AD_LINKS = [
            DIRECT_LINK,
            SHOPEE_LINKS[1],
            SHOPEE_LINKS[2]
        ];

        const video = document.getElementById('player');
        const statusBox = document.getElementById('status');

        const adBox = document.getElementById('adBox');
        const adMessage = document.getElementById('adMessage');
        const adButton = document.getElementById('adButton');
        const closeAd = document.getElementById('closeAd');

        const shownAds = new Set();

        let currentAdLink = '';

        /* =========================
           STATUS VIDEO
        ========================= */

        function showStatus(message) {
            statusBox.textContent = message;
            statusBox.hidden = false;
        }

        function hideStatus() {
            statusBox.hidden = true;
        }

        /* =========================
           AMBIL ID VIDEO DARI URL
           Contoh: domain.com/#/K1Jr.mp4
        ========================= */

        function getVideoId() {
            try {
                return decodeURIComponent(
                    location.hash.replace(/^#\/?/, '')
                ).trim();
            } catch (error) {
                console.error('ID video tidak valid:', error);
                return '';
            }
        }

        /* =========================
           LOAD VIDEO DARI videos.json
        ========================= */

        async function loadVideo() {
            const id = getVideoId();

            if (!id) {
                showStatus(
                    'ID video tidak ditemukan. Gunakan URL #/K1Jr.mp4'
                );
                return;
            }

            showStatus('Memuat video...');

            try {
                const response = await fetch(JSON_URL, {
                    cache: 'no-cache'
                });

                if (!response.ok) {
                    throw new Error(
                        'Gagal membuka videos.json (' +
                        response.status + ')'
                    );
                }

                const data = await response.json();

                const videos = Array.isArray(data.videos)
                    ? data.videos
                    : [];

                const selected = videos.find(function (item) {
                    return item.id === id;
                });

                if (!selected || !selected.cdn) {
                    throw new Error('Video tidak ditemukan: ' + id);
                }

                video.src = selected.cdn;
                video.load();

            } catch (error) {
                console.error('Kesalahan memuat video:', error);
                showStatus(error.message);
            }
        }

        /* =========================
           EVENT PEMUTAR VIDEO
        ========================= */

        video.addEventListener('loadedmetadata', hideStatus);
        video.addEventListener('canplay', hideStatus);
        video.addEventListener('playing', hideStatus);

        video.addEventListener('waiting', function () {
            showStatus('Memuat video...');
        });

        video.addEventListener('error', function () {
            showStatus(
                'Video gagal diputar. Periksa URL CDN atau format video.'
            );
        });

        /* =========================
           SISTEM IKLAN
           5 DETIK  = DIRECT LINK
           30 DETIK = SHOPEE LINK 2
           50 DETIK = SHOPEE LINK 3
        ========================= */

        video.addEventListener('timeupdate', function () {
            AD_TIMES.forEach(function (time, index) {
                if (
                    video.currentTime >= time &&
                    !shownAds.has(index)
                ) {
                    shownAds.add(index);

                    currentAdLink = AD_LINKS[index];

                    adMessage.textContent =
                        'Iklan ' + (index + 1) +
                        '. Ketuk "Buka Iklan" untuk melanjutkan.';

                    adBox.style.display = 'block';
                }
            });
        });

        /* =========================
           BUKA IKLAN
        ========================= */

        adButton.addEventListener('click', function () {
            if (!currentAdLink) {
                return;
            }

            // Dibuka melalui tindakan langsung pengguna.
            window.open(
                currentAdLink,
                '_blank',
                'noopener,noreferrer'
            );

            adBox.style.display = 'none';
            currentAdLink = '';
        });

        /* =========================
           TUTUP KOTAK IKLAN
        ========================= */

        closeAd.addEventListener('click', function () {
            adBox.style.display = 'none';
            currentAdLink = '';
        });

        /* =========================
           MULAI PLAYER
        ========================= */

        loadVideo();
    </script>

</body>
</html>
