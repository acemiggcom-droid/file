<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2XMZNLZYX6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag('js', new Date());
    gtag('config', 'G-2XMZNLZYX6');
    gtag('config', 'G-2EMZHLZYX6');
  </script>
  <!-- Histats -->
  <script>
    var _Hasync = _Hasync || [];
    _Hasync.push([
      'Histats.start',
      '1,5058948,4,0,0,0,00010000'
    ]);
    _Hasync.push(['Histats.fasi', '1']);
    _Hasync.push(['Histats.track_hits', '']);
    (function () {
      var hs = document.createElement('script');
      hs.async = true;
      hs.src = 'https://s10.histats.com/js15_as.js';
      (document.head || document.body).appendChild(hs);
    })();
  </script>
  <!-- CSS -->
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 10px;
    }
    .player {
      width: 100%;
      background: #000;
    }
    video {
      display: block;
      width: 100%;
      max-height: 85vh;
      background: #000;
    }
    #message {
      padding: 16px 8px;
      color: #ddd;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="player">
      <video
        id="video"
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
      ></video>
    </div>
    <div
      id="message"
      role="status"
      aria-live="polite"
    >
      Memuat video...
    </div>
  </main>
  <script>
    // ========================================
    // 1. ELEMEN VIDEO
    // ========================================
    const video = document.getElementById('video');
    const message = document.getElementById('message');
    // ========================================
    // 2. LINK IKLAN
    // ========================================
    const SHOPEE_1 = 'https://s.shopee.co.id/7AeWbiyANg';
    const SHOPEE_2 = 'https://s.shopee.co.id/4B0v6LaeiY';
    const SHOPEE_3 = 'https://s.shopee.co.id/9fLreWxby0';
    const SHOPEE_4 = 'https://s.shopee.co.id/4fxC7Qiaus';
    const DIRECT_LINK =
      'https://auctionr.org/4/91e60a9698632a87fc7082108970afbd';
    // ========================================
    // 3. JADWAL IKLAN SHOPEE
    // ========================================
    const ADS = [
      { time: 5,  url: SHOPEE_1 },
      { time: 15, url: SHOPEE_2 },
      { time: 30, url: SHOPEE_3 },
      { time: 50, url: SHOPEE_4 }
    ];
    const shownAds = new Set();
    let firstClickHandled = false;
    let waitingForAd = false;
    let checkClosed = null;
    // ========================================
    // 4. AMBIL ID VIDEO DARI URL
    // Contoh: index.html?id=K1Jr.mp4
    // ========================================
    function getVideoId() {
  const params = new URLSearchParams(window.location.search);
  const queryId = params.get("id");

  if (queryId) return queryId;

  const hash = window.location.hash;
  if (hash.startsWith("#/")) {
    return decodeURIComponent(hash.slice(2).split("?")[0]);
  }

  return "";
    }
    // ========================================
    // 5. SMART LINK SAAT KLIK PERTAMA
    // ========================================
    video.addEventListener('click', function () {
      if (firstClickHandled) return;
      firstClickHandled = true;
      window.open(DIRECT_LINK, '_blank');
    }, true);
    // ========================================
    // 6. TUNGGU IKLAN DITUTUP
    // ========================================
    function waitForAdToClose(adWindow) {
      if (!adWindow) return;
      waitingForAd = true;
      video.pause();
      checkClosed = setInterval(function () {
        try {
          if (adWindow.closed) {
            clearInterval(checkClosed);
            checkClosed = null;
            waitingForAd = false;
            video.play().catch(function () {
              message.textContent =
                'Tekan tombol Play untuk melanjutkan video.';
            });
          }
        } catch (error) {
          clearInterval(checkClosed);
          checkClosed = null;
          waitingForAd = false;
        }
      }, 500);
    }
    // ========================================
    // 7. IKLAN SHOPEE BERDASARKAN WAKTU VIDEO
    // ========================================
    video.addEventListener('timeupdate', function () {
      if (
        waitingForAd ||
        video.paused ||
        video.ended
      ) {
        return;
      }
      for (let i = 0; i < ADS.length; i++) {
        const ad = ADS[i];
        if (
          video.currentTime >= ad.time &&
          !shownAds.has(i)
        ) {
          shownAds.add(i);
          const adWindow = window.open(
            ad.url,
            '_blank'
          );
          if (adWindow) {
            waitForAdToClose(adWindow);
          }
          break;
        }
      }
    });
    // ========================================
    // 8. CEGAH VIDEO BERJALAN SAAT IKLAN AKTIF
    // ========================================
    video.addEventListener('play', function () {
      if (waitingForAd) {
        video.pause();
      }
    });
    // ========================================
    // 9. MUAT VIDEO DARI videos.json
    // ========================================
    async function loadVideo() {
      const id = getVideoId();
      if (!id) {
        message.textContent =
          'ID video tidak ditemukan. Gunakan ?id=K1Jr.mp4';
        return;
      }
      try {
        const response = await fetch('./videos.json', {
          cache: 'no-cache'
        });
        if (!response.ok) {
          throw new Error(
            'Gagal memuat videos.json: HTTP ' + response.status
          );
        }
        const data = await response.json();
        const videos = Array.isArray(data)
          ? data
          : data.videos;
        if (!Array.isArray(videos)) {
          throw new Error(
            'Format videos.json tidak valid.'
          );
        }
        const selectedVideo = videos.find(function (item) {
          return item.id === id;
        });
        if (!selectedVideo || !selectedVideo.cdn) {
          message.textContent =
            'Video ' + id + ' tidak ditemukan di videos.json.';
          return;
        }
        video.src = selectedVideo.cdn;
        video.load();
        message.textContent = 'Video siap diputar.';
      } catch (error) {
        console.error('Kesalahan memuat video:', error);
        message.textContent =
          'Video gagal dimuat. Periksa videos.json dan koneksi internet.';
      }
    }
    // ========================================
    // 10. PESAN ERROR PEMUTARAN
    // ========================================
    video.addEventListener('error', function () {
      message.textContent =
        'Video gagal diputar. Periksa URL CDN atau format video.';
    });
    video.addEventListener('playing', function () {
      if (!waitingForAd) {
        message.textContent = '';
      }
    });
    // ========================================
    // 11. JALANKAN PEMUATAN VIDEO
    // ========================================
    loadVideo();
  </script>
</body>
</html>
