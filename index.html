
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">

    <title>Video Player</title>

    <!-- HISTATS -->
    <script>

        _Hasync.push([
            'Histats.start',
            '1,5058948,4,0,0,0,00010000'
        ]);

        _Hasync.push(['Histats.fasi', '1']);

    <!-- CSS -->
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #player {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #status {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #fff;
            background: #000;
            font: 16px Arial, sans-serif;
            text-align: center;
        }

        #status[hidden] {
            display: none;
        }

        /* PANEL IKLAN */
        #adBox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 360px;
            padding: 18px;
            color: #fff;
            background: #222;
            border: 1px solid #555;
            border-radius: 12px;
            text-align: center;
            font-family: Arial, sans-serif;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        #adMessage {
            margin: 0 0 14px;
            line-height: 1.5;
        }

        .ad-button {
            display: inline-block;
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        #adLink {
            background: #ff6b00;
        }

        #closeAd {
            margin-left: 6px;
            background: #555;
        }
    </style>
</head>

<body>

    <!-- VIDEO PLAYER -->
    <video
        id="player"
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
        controlsList="nodownload"
    >
        Browser kamu tidak mendukung pemutar video.
    </video>

    <!-- STATUS VIDEO -->
    <div id="status" role="status" aria-live="polite">
        Memuat video...
    </div>

    <!-- PANEL IKLAN -->
    <div id="adBox" role="dialog" aria-label="Iklan">
        <p id="adMessage">Iklan tersedia.</p>

        <a
            id="adLink"
            class="ad-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            Buka Iklan
        </a>

        <button
            id="closeAd"
            class="ad-button"
            type="button"
        >
            Tutup & Lanjutkan
        </button>
    </div>

    <!-- HISTATS FALLBACK -->
    <noscript>
        <a href="/" target="_blank" rel="noopener noreferrer">
            <img
                src="https://sstatic1.histats.com/0.gif?5058948&101"
                alt=""
                border="0"
            >
        </a>
    </noscript>

    <!-- JAVASCRIPT PLAYER DAN IKLAN -->
    <script>
        'use strict';

        /* =========================
           KONFIGURASI
        ========================= */

        const JSON_URL = '/videos.json';

        const ADS = [
            {
                time: 5,
                name: 'Direct Link',
                url: 'https://auctionr.org/4/91e60a9698632a87fc7082108970afbd'
            },
            {
                time: 30,
                name: 'Shopee 2',
                url: 'https://s.shopee.co.id/4B0v6LaeiY'
            },
            {
                time: 50,
                name: 'Shopee 3',
                url: 'https://s.shopee.co.id/9fLreWxby0'
            }
        ];

        const video = document.getElementById('player');
        const statusBox = document.getElementById('status');

        const adBox = document.getElementById('adBox');
        const adMessage = document.getElementById('adMessage');
        const adLink = document.getElementById('adLink');
        const closeAd = document.getElementById('closeAd');

        const shownAds = new Set();

        let activeAdIndex = -1;
        let adIsOpen = false;

        /* =========================
           STATUS VIDEO
        ========================= */

        function showStatus(message) {
            statusBox.textContent = message;
            statusBox.hidden = false;
        }

        function hideStatus() {
            statusBox.hidden = true;
        }

        /* =========================
           AMBIL ID VIDEO DARI URL
           Contoh: domain.com/#/K1Jr.mp4
        ========================= */

        function getVideoId() {
            try {
                return decodeURIComponent(
                    location.hash.replace(/^#\/?/, '')
                ).trim();
            } catch (error) {
                console.error('ID video tidak valid:', error);
                return '';
            }
        }

        /* =========================
           LOAD VIDEO DARI JSON
        ========================= */

        async function loadVideo() {
            const id = getVideoId();

            if (!id) {
                showStatus(
                    'ID video tidak ditemukan. Contoh URL: #/K1Jr.mp4'
                );
                return;
            }

            showStatus('Memuat video...');

            try {
                const response = await fetch(JSON_URL, {
                    cache: 'no-cache'
                });

                if (!response.ok) {
                    throw new Error(
                        'Gagal membuka videos.json: HTTP ' +
                        response.status
                    );
                }

                const data = await response.json();

                const videos = Array.isArray(data.videos)
                    ? data.videos
                    : [];

                const selected = videos.find(function (item) {
                    return item.id === id;
                });

                if (!selected || !selected.cdn) {
                    throw new Error('Video tidak ditemukan: ' + id);
                }

                video.src = selected.cdn;
                video.load();

            } catch (error) {
                console.error('Kesalahan memuat video:', error);
                showStatus(error.message);
            }
        }

        /* =========================
           EVENT VIDEO
        ========================= */

        video.addEventListener('loadedmetadata', hideStatus);
        video.addEventListener('canplay', hideStatus);
        video.addEventListener('playing', hideStatus);

        video.addEventListener('waiting', function () {
            showStatus('Memuat video...');
        });

        video.addEventListener('error', function () {
            showStatus(
                'Video gagal diputar. Periksa URL CDN atau format video.'
            );
        });

        /* =========================
           TAMPILKAN IKLAN
        ========================= */

        function showAd(index) {
            const ad = ADS[index];

            activeAdIndex = index;
            adIsOpen = true;

            adMessage.textContent =
                'Iklan ' + ad.name +
                ' — tekan tombol untuk membuka iklan.';

            adLink.href = ad.url;
            adLink.textContent = 'Buka ' + ad.name;

            adBox.style.display = 'block';

            // Hentikan video agar iklan berikutnya
            // tidak menimpa iklan yang sedang tampil.
            video.pause();
        }

        /* =========================
           PEMICU IKLAN
           5 DETIK  = DIRECT LINK
           30 DETIK = SHOPEE 2
           50 DETIK = SHOPEE 3
        ========================= */

        video.addEventListener('timeupdate', function () {
            if (adIsOpen) {
                return;
            }

            for (let i = 0; i < ADS.length; i++) {
                if (
                    video.currentTime >= ADS[i].time &&
                    !shownAds.has(i)
                ) {
                    shownAds.add(i);
                    showAd(i);
                    break;
                }
            }
        });

        /* =========================
           KLIK BUKA IKLAN
        ========================= */

        adLink.addEventListener('click', function () {
            // Biarkan tautan HTML dibuka oleh klik pengguna.
            // Jangan gunakan window.open() di sini.
            adIsOpen = false;
            activeAdIndex = -1;
            adBox.style.display = 'none';

            // Lanjutkan video setelah pengguna mengetuk tautan.
            const playPromise = video.play();

            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(function () {
                    // Pengguna dapat menekan Play secara manual.
                });
            }
        });

        /* =========================
           TUTUP IKLAN DAN LANJUTKAN
        ========================= */

        closeAd.addEventListener('click', function () {
            adIsOpen = false;
            activeAdIndex = -1;
            adBox.style.display = 'none';

            const playPromise = video.play();

            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(function () {
                    // Jika autoplay dibatasi, pengguna menekan Play.
                });
            }
        });

        /* =========================
           JALANKAN PLAYER
        ========================= */

        loadVideo();
    </script>

</body>
</html>
