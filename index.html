
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>Video Player</title>

    <!-- GOOGLE ANALYTICS -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2XMZNLZYX6"></script>
    <script>

        function gtag() {

        gtag('config', 'G-2XMZNLZYX6');

    <!-- HISTATS -->
    <script>
        var _Hasync = window._Hasync || [];
        _Hasync.push([
            'Histats.start',
            '1,5058948,4,0,0,0,00010000'
        ]);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);

        (function () {
            var hs = document.createElement('script');

            hs.type = 'text/javascript';

            document.head.appendChild(hs);

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #player {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #status {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #000;
            color: #fff;
            text-align: center;
            font: 16px Arial, sans-serif;
        }

        #status[hidden] {
            display: none;
        }

        #adBox {
            display: none;
            position: fixed;
            z-index: 20;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 360px;
            padding: 18px;
            border: 1px solid #555;
            border-radius: 12px;
            background: #202020;
            color: #fff;
            text-align: center;
            font-family: Arial, sans-serif;
            box-shadow: 0 4px 20px #0009;
        }

        #adMessage {
            margin: 0 0 14px;
            line-height: 1.5;
        }

        .ad-button {
            padding: 12px 16px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        #adButton {
            background: #ff6b00;
        }

        #closeAd {
            margin-left: 6px;
            background: #555;
        }

        #adQueue {
            margin-top: 10px;
            color: #ccc;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- PEMUTAR VIDEO -->
    <video
        id="player"
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
        controlsList="nodownload"
    >
        Browser kamu tidak mendukung pemutar video.
    </video>

    <!-- STATUS -->
    <div id="status" role="status" aria-live="polite">
        Memuat video...
    </div>

    <!-- PANEL IKLAN -->
    <div id="adBox" role="dialog" aria-label="Iklan">
        <p id="adMessage">Iklan tersedia.</p>

        <button id="adButton" class="ad-button" type="button">
            Buka Iklan
        </button>

        <button id="closeAd" class="ad-button" type="button">
            Tutup
        </button>

        <div id="adQueue"></div>
    </div>

    <!-- HISTATS FALLBACK -->
    <noscript>
        <a href="/" target="_blank" rel="noopener noreferrer">
            <img
                src="https://sstatic1.histats.com/0.gif?5058948&101"
                alt=""
                border="0"
            >
        </a>
    </noscript>

    <script>
        'use strict';

        /* =========================
           KONFIGURASI VIDEO
        ========================= */

        const JSON_URL = '/videos.json';

        const DIRECT_LINK =
            'https://auctionr.org/4/91e60a9698632a87fc7082108970afbd';

        const SHOPEE_LINKS = [
            'https://s.shopee.co.id/7AeWbiyANg',
            'https://s.shopee.co.id/4B0v6LaeiY',
            'https://s.shopee.co.id/9fLreWxby0'
        ];

        /* =========================
           KONFIGURASI IKLAN
        ========================= */

        const ADS = [
            {
                time: 5,
                name: 'Direct Link',
                url: DIRECT_LINK
            },
            {
                time: 30,
                name: 'Shopee 2',
                url: SHOPEE_LINKS[1]
            },
            {
                time: 50,
                name: 'Shopee 3',
                url: SHOPEE_LINKS[2]
            }
        ];

        const video = document.getElementById('player');
        const statusBox = document.getElementById('status');
        const adBox = document.getElementById('adBox');
        const adMessage = document.getElementById('adMessage');
        const adButton = document.getElementById('adButton');
        const closeAd = document.getElementById('closeAd');
        const adQueue = document.getElementById('adQueue');

        // Antrean iklan mencegah link iklan saling menimpa.
        const pendingAds = [];
        const shownAds = new Set();

        let activeAd = null;

        function showStatus(message) {
            statusBox.textContent = message;
            statusBox.hidden = false;
        }

        function hideStatus() {
            statusBox.hidden = true;
        }

        /* =========================
           ID VIDEO DARI HASH URL
           Contoh: domain.com/#/K1Jr.mp4
        ========================= */

        function getVideoId() {
            try {
                return decodeURIComponent(
                    location.hash.replace(/^#\/?/, '')
                ).trim();
            } catch (error) {
                console.error('Hash video tidak valid:', error);
                return '';
            }
        }

        /* =========================
           MEMUAT VIDEOS.JSON
        ========================= */

        async function loadVideo() {
            const id = getVideoId();

            if (!id) {
                showStatus(
                    'ID video tidak ditemukan. Contoh URL: #/K1Jr.mp4'
                );
                return;
            }

            showStatus('Memuat video...');

            try {
                const response = await fetch(JSON_URL, {
                    cache: 'no-cache'
                });

                if (!response.ok) {
                    throw new Error(
                        'videos.json gagal dimuat: HTTP ' +
                        response.status
                    );
                }

                const data = await response.json();
                const videos = Array.isArray(data.videos)
                    ? data.videos
                    : [];

                const selected = videos.find(function (item) {
                    return item.id === id;
                });

                if (!selected || !selected.cdn) {
                    throw new Error('Video tidak ditemukan: ' + id);
                }

                video.src = selected.cdn;
                video.load();

            } catch (error) {
                console.error(error);
                showStatus(error.message);
            }
        }

        /* =========================
           STATUS PEMUTAR
        ========================= */

        video.addEventListener('loadedmetadata', hideStatus);
        video.addEventListener('canplay', hideStatus);
        video.addEventListener('playing', hideStatus);

        video.addEventListener('waiting', function () {
            showStatus('Memuat video...');
        });

        video.addEventListener('error', function () {
            showStatus(
                'Video gagal diputar. Periksa CDN dan format video.'
            );
        });

        /* =========================
           ANTREAN IKLAN BERDASARKAN
           WAKTU VIDEO
        ========================= */

        function updateAdQueue() {
            if (pendingAds.length === 0) {
                adQueue.textContent = '';
                return;
            }

            adQueue.textContent =
                'Iklan menunggu: ' + pendingAds.length;
        }

        function showNextAd() {
            if (activeAd || pendingAds.length === 0) {
                updateAdQueue();
                return;
            }

            activeAd = pendingAds.shift();

            adMessage.textContent =
                'Iklan ' + activeAd.name +
                ' — ketuk tombol untuk membukanya.';

            adButton.textContent = 'Buka ' + activeAd.name;
            adBox.style.display = 'block';

            updateAdQueue();
        }

        function queueAd(ad) {
            pendingAds.push(ad);
            showNextAd();
        }

        video.addEventListener('timeupdate', function () {
            ADS.forEach(function (ad, index) {
                if (
                    video.currentTime >= ad.time &&
                    !shownAds.has(index)
                ) {
                    shownAds.add(index);
                    queueAd(ad);
                }
            });
        });

        /* =========================
           BUKA IKLAN DENGAN KLIK
        ========================= */

        adButton.addEventListener('click', function () {
            if (!activeAd) {
                return;
            }

            const link = activeAd.url;

            // Link dibuka langsung dari tindakan klik pengguna.
            window.open(link, '_blank');

            activeAd = null;
            adBox.style.display = 'none';

            showNextAd();
        });

        /* =========================
           TUTUP IKLAN SAAT INI
        ========================= */

        closeAd.addEventListener('click', function () {
            activeAd = null;
            adBox.style.display = 'none';

            // Iklan berikutnya tetap berada dalam antrean.
            showNextAd();
        });

        /* =========================
           MULAI
        ========================= */

        loadVideo();
    </script>

</body>
</html>
