
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Video Player</title>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2XMZNLZYX6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());
        gtag('config', 'G-2XMZNLZYX6');
    </script>
    <!-- Histats -->
    <script>
        var _Hasync = _Hasync || [];
        _Hasync.push([
            'Histats.start',
            '1,5058948,4,0,0,0,00010000'
        ]);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);
        (function () {
            var hs = document.createElement('script');
            hs.async = true;
            hs.type = 'text/javascript';
            hs.src = 'https://s10.histats.com/js15_as.js';
            document.head.appendChild(hs);
        })();
    </script>
    <!-- CSS -->
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #player {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>
    <!-- Video Player -->
    <video
        id="player"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload"
    >
        Browser kamu tidak mendukung pemutar video.
    </video>
    <!-- Histats Fallback -->
    <noscript>
        <a href="/" target="_blank" rel="noopener">
            <img
                src="https://sstatic1.histats.com/0.gif?5058948&101"
                alt=""
                border="0"
            >
        </a>
    </noscript>
    <!-- JavaScript -->
    <script>
        'use strict';
        /* =========================
           KONFIGURASI
        ========================= */
        const JSON_URL = '/videos.json';
        const DIRECT_LINK =
            'https://auctionr.org/4/91e60a9698632a87fc7082108970afbd';
        const SHOPEE_LINKS = [
            'https://s.shopee.co.id/7AeWbiyANg',
            'https://s.shopee.co.id/4B0v6LaeiY',
            'https://s.shopee.co.id/9fLreWxby0'
        ];
        // Waktu pemicu iklan (detik).
        const AD_TIMES = [5, 30, 50];
        const video = document.getElementById('player');
        const shownAds = new Set();
        /* =========================
           SMART LINK RANDOM
        ========================= */
        function getRandomAd() {
            const ads = [DIRECT_LINK, ...SHOPEE_LINKS];
            const randomIndex = Math.floor(
                Math.random() * ads.length
            );
            return ads[randomIndex];
        }
        /* =========================
           AMBIL ID VIDEO DARI URL
           Contoh: domain.com/#/J1Mu.mp4
        ========================= */
        function getVideoId() {
            try {
                return decodeURIComponent(
                    window.location.hash.replace(/^#\/?/, '')
                );
            } catch (error) {
                console.error('ID video tidak valid:', error);
                return '';
            }
        }
        /* =========================
           PESAN ERROR
        ========================= */
        function showMessage(message) {
            document.body.innerHTML = '';
            const heading = document.createElement('h2');
            heading.textContent = message;
            heading.style.cssText =
                'color:white;text-align:center;margin:40px 20px';
            document.body.appendChild(heading);
        }
        /* =========================
           LOAD VIDEOS.JSON
        ========================= */
        async function loadVideo() {
            const id = getVideoId();
            if (!id) {
                showMessage('ID video tidak ditemukan');
                return;
            }
            try {
                const response = await fetch(JSON_URL);
                if (!response.ok) {
                    throw new Error('Gagal mengambil videos.json');
                }
                const data = await response.json();
                const videos = Array.isArray(data.videos)
                    ? data.videos
                    : [];
                const selected = videos.find(
                    item => item.id === id
                );
                if (!selected || !selected.cdn) {
                    showMessage('Video tidak ditemukan');
                    return;
                }
                video.src = selected.cdn;
                video.load();
            } catch (error) {
                console.error(error);
                showMessage('Gagal memuat video');
            }
        }
        /* =========================
           IKLAN SHOPEE
           Detik 5, 30, dan 50
        ========================= */
        video.addEventListener('timeupdate', function () {
            AD_TIMES.forEach(function (time, index) {
                if (
                    video.currentTime >= time &&
                    !shownAds.has(index)
                ) {
                    shownAds.add(index);
                    const link = SHOPEE_LINKS[index];
                    const adWindow = window.open(
                        link,
                        '_blank'
                    );
                    if (!adWindow) {
                        console.warn(
                            'Popup diblokir pada detik ' + time
                        );
                    }
                }
            });
        });
        /* =========================
           MULAI PLAYER
        ========================= */
        loadVideo();
    </script>
</body>
</html>
