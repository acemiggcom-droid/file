
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2XMZNLZYX6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-2EMZHLZYX6');
    </script>

    <!-- Histats.com START -->
    <script type="text/javascript">
        var _Hasync = _Hasync || [];

        _Hasync.push([
            'Histats.start',
            '1,5058948,4,0,0,0,00010000'
        ]);

        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);

        (function () {
            var hs = document.createElement('script');
            hs.type = 'text/javascript';
            hs.async = true;
            hs.src = '//s10.histats.com/js15_as.js';

            (document.getElementsByTagName('head')[0] ||
             document.getElementsByTagName('body')[0])
                .appendChild(hs);
        })();
    </script>
    <!-- Histats.com END -->

    <style>
        body {
            margin: 0;
            background: #000;
        }

        video {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }

        #title {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Video Player -->
    <video
        id="player"
        controls
        playsinline
        controlsList="nodownload">
        <source src="" type="video/mp4">
    </video>

    <!-- Histats fallback -->
    <noscript>
        <a href="/" target="_blank">
            <img
                src="//sstatic1.histats.com/0.gif?5058948&101"
                alt=""
                border="0">
        </a>
    </noscript>

    <script>
        /* KONFIGURASI */
        const JSON_URL = "/videos.json";

        /* SMART LINK */
        const DIRECT_LINK =
            "https://auctionr.org/4/fd7294e24ebdccb582d7959eb5c35db8";

        /* SHOPEE */
        const SHOPEE_LINK =
            "https://s.shopee.co.id/6q1ZKA9oXe";

        const video = document.getElementById("player");

        let clicked = false;
        let redirected = false;

        /* PILIH IKLAN RANDOM */
        function getRandomAd() {
            const ads = [
                DIRECT_LINK,
                SHOPEE_LINK
            ];

            const randomIndex =
                Math.floor(Math.random() * ads.length);

            return ads[randomIndex];
        }

        /* REDIRECT RANDOM */
        function redirectRandom() {
            if (redirected) return;

            redirected = true;

            const selectedAd = getRandomAd();

            window.location.href = selectedAd;
        }

        /* AMBIL ID VIDEO DARI URL */
        const hash = window.location.hash;

        const id = decodeURIComponent(
            hash.replace(/^#\/?/, '')
        );

        /* LOAD VIDEOS.JSON */
        fetch(JSON_URL)
            .then(res => {
                if (!res.ok) {
                    throw new Error(
                        "Gagal mengambil videos.json"
                    );
                }

                return res.json();
            })
            .then(data => {
                const vids = data.videos;

                const selected =
                    vids.find(v => v.id === id);

                if (!selected) {
                    document.body.innerHTML =
                        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';
                    return;
                }

                video.src = selected.cdn;
            })
            .catch(error => {
                console.error(error);

                document.body.innerHTML =
                    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';
            });

        /* KLIK VIDEO */
        video.addEventListener("click", function () {
            if (!clicked) {
                clicked = true;
                return;
            }

            redirectRandom();
        });

        /* REDIRECT SETELAH 30 DETIK */
        video.addEventListener("timeupdate", function () {
            if (
                !redirected &&
                video.currentTime >= 30
            ) {
                redirectRandom();
            }
        });
    </script>

</body>
</html>
